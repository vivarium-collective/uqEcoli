[project]
name = "uqEcoli"
version = "0.0.1"
description = "uqEcoli"
authors = [{ name = "Alex Patrie", email = "alexanderpatrie@gmail.com" }]
requires-python = "==3.12.12"
readme = "README.md"
dependencies = [
    "duckdb>=1.5.0",
    "emcee>=3.1.6",
    "ezyrb>=1.3.3",
    "ipykernel>=7.2.0",
    "kaleido>=1.2.0",
    "plotly>=6.6.0",
    "polars>=1.39.0",
    "process-bigraph>=1.0.6",
    "pydmd>=2025.8.1",
    "python-dotenv>=1.2.2",
    "pyttsx3>=2.99",
    "pytuq[all]>=1.0.0",
    "ray[data,train,tune]>=2.55.0",
    "salib>=1.5.2",
    "sbi>=0.26.1",
    "scipy-stubs>=1.17.1.2",
    "setuptools>=82.0.1",
    "sobol>=0.9",
    "textual>=8.2.1",
    "typer>=0.24.1",
    "uqpy>=4.1.6",
    "v2ecoli",
    "vecoli",
    "vl-convert-python>=1.9.0.post1",
    "xarray>=2026.4",
    "zarr>=3.1.6",
    "zarrs>=0.2",
]

[project.scripts]
uq-ultra = "libuq.cli:app"
uq = "uq.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "uq",
    "apollo",
    "pbg_uqEcoli",
    "tests",
    "flow",
    "inference"
]

[tool.hatch.build.targets.wheel]
include = [
    "uq",
    "apollo",
    "pbg_uqEcoli",
    "tests",
    "flow",
    "inference"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
api = [
    "fastapi>=0.135.1",
]
app = [
    "altair>=6.0.0",
    "marimo[recommended]>=0.23.0",
    "wigglystuff>=0.2.39",
    "vegafusion>=2.0.3",
]
dev = [
    "deptry>=0.24.0",
    "mypy>=1.19.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "scipy-stubs>=1.17.1.2",
    "tox>=4.49.1",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.9.8",
    "sphinx-rtd-theme>=3.1.0",
]
music = [
    "music21>=9.9.1",
    "partitura>=1.8.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
]
# tui = [
#     "transformers>=4.40.0,<5",
#     "accelerate>=0.30.0,<1",
#     "torch>=2.2.0,<3",
#     "textual",
#     "fastmcp>=2.13.0.2",
#     "ollama>=0.4.0",
#     "process-bigraph>=1.0.5",
# ]
# agent = [
#     "smolagents[audio,toolkit,transformers,vision]>=1.24.0",
# ]

[tool.uv]
default-groups = [
    "app",
    "api",
    "dev",
    "docs",
]

# Floor versions for transitive deps with known vulnerabilities
constraint-dependencies = [
    "pillow>=12.2.0",
    "jupyter-server>=2.18.0",
    "jupyterlab>=4.5.7",
    "notebook>=7.5.6",
    "nbconvert>=7.17.1",
    "lxml>=6.1.0",
    "aiohttp>=3.13.4",
    "cryptography>=46.0.7",
    "requests>=2.33.0",
    "Pygments>=2.20.0",
]

[tool.uv.sources]
vecoli = { path = "../vEcoli-private", editable = true }
v2ecoli = { path = "../../vivarium-app/v2ecoli", editable = true }

# ortools 9.10 lacks cp313 wheels; vecoli pins it transitively.
# Override to a version that ships Python 3.13 wheels.
# override-dependencies = ["ortools>=9.11"]

[tool.mypy]
files = ["uq"]
strict = true
exclude = ['^tutorials/*', '^examples/*', '^app/*']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-report=html"

[tool.deptry]
exclude = [".venv/*", "tutorials/*", "examples/*", "app/*"]
ignore = ["DEP002", "DEP003", "DEP004", "DEP001"]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    "UP007",
    # "DEP001",
    "A001",
    "A002",
    "B008",
    "B007",
    "B904",
    "C414",
    "C416",
    "C417",
    "C419",
    "E722",
    "RUF012",
    "S311",
    "TRY002",
    "TRY003",
    "TRY201",
    "TRY300",
    "UP006",
    "S603",
    "S324",
    "S301",
    "F401",
    "SIM108",
    "F841",
    "RUF002",
    "RUF001",
    "C901",
    "S608",
    "B028",
    "RUF005",
    "S112",
    "RUF022",
    "C401",
    "B018",
    "C408",
    "E731",
    "RUF003",
    "S108",
    "B017"
]
exclude = [".venv/*", "docs/*", "tutorials/*", "examples/*", "app/*"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["uq"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
